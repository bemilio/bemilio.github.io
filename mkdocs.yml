site_name: Emilio Benenati
site_description: Personal website
site_url: https://bemilio.github.io
theme:
    # icon:
    name: material
    palette:
        primary: cyan
        accent: cyan
        scheme: slate
    font:
        text: Montserrat
plugins:
    - blog
    - include-markdown
    - search
    - git-revision-date-localized
    - social
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
    - "": index.md
    - Publications: pub.md
    - Blog:
        - blog/index.md
    - About: about.md


extra:
  social:
    - icon: material/email
      link: mailto:benenati@kth.se
    - icon: fontawesome/brands/github
      link: https://www.github.com/bemilio
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/emilio-benenati/
